openapi: 3.0.3
info:
  title: WorkoutWager API
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    Goals with money on the line, in **play money** for now. Every user starts with a
    balance of 50. Creating a goal escrows its `stake` from `balance` into `pendingBalance`.
    Completing a milestone returns its share of the stake plus 10% of it as **stars**;
    missing a deadline forfeits it. All-or-nothing goals settle once: everything or nothing.
    Stars rank users on the leaderboard.

    **Authentication:** every endpoint requires a Cognito **ID token** in the
    `Authorization` header (`Bearer <token>`). The caller's identity always comes
    from the verified token; any `userId` sent in a request body is ignored.
    Requests for another user's goals return `404`, exactly like a missing goal.
servers:
  - url: https://wager.api.dkustarnikov.com
    description: Production (API Gateway custom domain)
  - url: https://{apiId}.execute-api.us-east-2.amazonaws.com/prod
    description: Raw API Gateway URL (the `BrunoExecuteApiUrl` stack output)
    variables:
      apiId: { default: your-api-id }
security:
  - cognitoIdToken: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check (public)
      tags: [Health]
      security: []
      responses:
        '200': { description: Healthy, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }

  /goals:
    get:
      operationId: listGoals
      summary: List the caller's goals
      tags: [Goals]
      responses:
        '200':
          description: The caller's goals (empty array if none)
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Goal' } } } }
        '400': { description: No user identity on the request }

  /goal:
    post:
      operationId: createGoal
      summary: Create a goal
      description: |
        Escrows `stake` from the caller's balance (`400` if the balance is too low).
        Milestone stakes are optional: if every milestone has one they must sum exactly
        to `stake`, otherwise the stake is split evenly. The last milestone's deadline
        must equal the goal `deadline`, which must be in the future. If `milestones` is
        empty, a single milestone covering the whole goal is created. New milestones
        always start pending.
      tags: [Goals]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoalInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/GoalWithProgress' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /goal/{goalId}:
    parameters: [{ $ref: '#/components/parameters/goalId' }]
    get:
      operationId: getGoal
      summary: Get a goal
      tags: [Goals]
      responses:
        '200': { description: The goal, content: { application/json: { schema: { $ref: '#/components/schemas/GoalWithProgress' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/GoalNotFound' }
    put:
      operationId: updateGoal
      summary: Replace a goal's details and milestones
      description: |
        Same rules as create. Only allowed while the goal is still `created` (nothing
        resolved yet); a changed stake escrows or releases the difference. Milestones
        removed by the update have their deadline rules deleted.
      tags: [Goals]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoalInput' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/GoalWithProgress' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/GoalNotFound' }
    delete:
      operationId: deleteGoal
      summary: Delete a goal, its deadline rules, and release any escrowed stake
      tags: [Goals]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/GoalNotFound' }

  /goal/{goalId}/cancel:
    parameters: [{ $ref: '#/components/parameters/goalId' }]
    post:
      operationId: cancelGoal
      summary: Cancel a goal with no penalty
      description: |
        Removes pending deadline rules and returns whatever stake is still escrowed (all of
        it before start or for all-or-nothing goals, otherwise the pending milestones' share),
        recorded as a `cancelled` transaction. Not allowed once the goal is resolved.
      tags: [Goals]
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  goal: { $ref: '#/components/schemas/Goal' }
        '400': { description: Goal is already resolved or cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/GoalNotFound' }

  /goal/{goalId}/milestone:
    parameters: [{ $ref: '#/components/parameters/goalId' }]
    post:
      operationId: addMilestone
      summary: Add a milestone (before the goal starts)
      description: The goal stake is unchanged and re-split across all milestones, unless the new milestone has an explicit `stake`.
      tags: [Milestones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [milestone]
              properties:
                milestone: { $ref: '#/components/schemas/MilestoneInput' }
      responses:
        '200': { description: The updated goal, content: { application/json: { schema: { $ref: '#/components/schemas/Goal' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/GoalNotFound' }

  /goal/{goalId}/milestone/{milestoneId}:
    parameters:
      - { $ref: '#/components/parameters/goalId' }
      - { $ref: '#/components/parameters/milestoneId' }
    put:
      operationId: updateMilestone
      summary: Update a milestone (before the goal starts)
      description: The milestone's completion state is preserved. Changing the deadline reschedules its deadline rule.
      tags: [Milestones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [milestone]
              properties:
                milestone: { $ref: '#/components/schemas/MilestoneInput' }
      responses:
        '200': { description: The updated goal, content: { application/json: { schema: { $ref: '#/components/schemas/Goal' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Goal or milestone not found }

  /goal/{goalId}/milestone/{milestoneId}/complete:
    parameters:
      - { $ref: '#/components/parameters/goalId' }
      - { $ref: '#/components/parameters/milestoneId' }
    post:
      operationId: completeMilestone
      summary: Mark a milestone as completed
      description: |
        Per-milestone goals: returns that milestone's stake plus 10% stars right away.
        All-or-nothing goals: nothing settles until the last milestone; then the whole
        stake plus stars. Completing an already-completed milestone is a no-op.
      tags: [Milestones]
      responses:
        '200': { description: Completed (or already completed) }
        '400': { description: 'Milestone was already missed, or the goal is resolved' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Goal or milestone not found }

  /goal/{goalId}/transactions:
    parameters: [{ $ref: '#/components/parameters/goalId' }]
    get:
      operationId: listGoalTransactions
      summary: Settlement history for a goal (newest first)
      tags: [Transactions]
      responses:
        '200': { description: Transactions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Transaction' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /configure-user:
    post:
      operationId: configureUser
      summary: Create or refresh the caller's profile
      description: Creates the profile on first call and syncs `goalIds` from the caller's goals. The email comes from the token, falling back to the body.
      tags: [Users]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Configured }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /get-user-info:
    post:
      operationId: getUserInfo
      summary: Get the caller's profile
      description: Always returns the caller's own profile. Body fields are ignored.
      tags: [Users]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No profile yet — call /configure-user first }

  /leaderboard:
    get:
      operationId: getLeaderboard
      summary: All users ranked by stars
      description: Usernames that are email addresses are masked (e.g. `runn•••`).
      tags: [Users]
      responses:
        '200': { description: Leaderboard, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LeaderboardEntry' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /configure-payments:
    post:
      operationId: configurePayments
      summary: Switch between play money and (future) real money
      description: Real payments aren't integrated yet; the provider is recorded as `stub`.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playMoney]
              properties:
                playMoney: { type: boolean }
                provider: { type: string, default: stub }
                details: { type: object, additionalProperties: true }
      responses:
        '200': { description: Configured }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No profile yet — call /configure-user first }

components:
  securitySchemes:
    cognitoIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito ID token (RS256), e.g. from `aws cognito-idp initiate-auth` — see the `BrunoGetTokenCommand` stack output.

  parameters:
    goalId: { name: goalId, in: path, required: true, schema: { type: string, format: uuid } }
    milestoneId: { name: milestoneId, in: path, required: true, schema: { type: string } }

  responses:
    Unauthorized: { description: Missing or invalid token }
    GoalNotFound: { description: The goal doesn't exist or belongs to another user }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: array, items: { type: string } }

  schemas:
    Message:
      type: object
      properties: { message: { type: string } }

    GoalStatus:
      type: string
      enum: [created, inProgress, completed, failed, cancelled]

    MilestoneInput:
      type: object
      required: [milestoneName, type, milestoneDeadline]
      properties:
        milestoneId: { type: string, description: Optional on create; generated if missing }
        milestoneName: { type: string, example: Week 1 }
        type: { type: string, example: common }
        milestoneDeadline: { type: string, format: date-time, example: '2026-12-31T00:00:00Z' }
        stake: { type: number, minimum: 0, exclusiveMinimum: true, example: 50, description: Optional share of the goal stake }

    Milestone:
      allOf:
        - $ref: '#/components/schemas/MilestoneInput'
        - type: object
          required: [milestoneId, milestoneCounter, stake]
          properties:
            milestoneCounter: { type: integer, description: 1-based order within the goal }
            completion:
              type: boolean
              description: '`true` = completed, `false` = missed, absent = pending. Set by the server only.'

    GoalInput:
      type: object
      required: [goalType, goalName, generalObjective, stake, deadline, milestones]
      properties:
        goalType: { type: string, example: fitness }
        goalName: { type: string, example: Run 3x per week }
        generalObjective: { type: string }
        stake: { type: number, minimum: 0, exclusiveMinimum: true, description: Play money escrowed from your balance, example: 20 }
        deadline: { type: string, format: date-time }
        milestones: { type: array, items: { $ref: '#/components/schemas/MilestoneInput' } }
        allOrNothing: { type: boolean, default: false, description: 'If true, the stake settles once: all milestones or nothing' }

    Goal:
      type: object
      properties:
        goalId: { type: string, format: uuid }
        userId: { type: string, description: Owner's Cognito sub }
        goalType: { type: string }
        goalName: { type: string }
        generalObjective: { type: string }
        stake: { type: number }
        deadline: { type: string, format: date-time }
        milestones: { type: array, items: { $ref: '#/components/schemas/Milestone' } }
        allOrNothing: { type: boolean }
        status: { $ref: '#/components/schemas/GoalStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GoalWithProgress:
      allOf:
        - $ref: '#/components/schemas/Goal'
        - type: object
          properties:
            completionPercentage: { type: number, description: '% of milestones completed, one decimal' }

    Transaction:
      type: object
      properties:
        transactionId: { type: string }
        goalId: { type: string }
        userId: { type: string }
        timestamp: { type: string, format: date-time }
        outcome: { type: string, enum: [escrowed, won, lost, mixed, cancelled] }
        entries:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [escrow, refund, forfeit, stars] }
              amount: { type: number }
              reason: { type: string }
        milestonesSummary:
          type: object
          properties:
            total: { type: integer }
            completed: { type: integer }
            missed: { type: integer }
        goalSnapshot:
          type: object
          properties:
            goalName: { type: string }
            allOrNothing: { type: boolean }
            stake: { type: number }

    User:
      type: object
      properties:
        userId: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        goalIds: { type: array, items: { type: string } }
        balance: { type: number, description: Available play money (new users start with 50) }
        pendingBalance: { type: number, description: Escrowed in active goals }
        stars: { type: number }
        playMoney: { type: boolean }

    LeaderboardEntry:
      type: object
      properties:
        userId: { type: string }
        username: { type: string, description: Emails are masked }
        stars: { type: number }
        balance: { type: number }
        pendingBalance: { type: number }
